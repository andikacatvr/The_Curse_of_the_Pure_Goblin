<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Template Game 2D - Karya Cerita Kelompok</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0b0f19;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }
        .header-bar {
            margin-bottom: 12px;
            text-align: center;
        }
        .header-bar h1 {
            font-size: 20px;
            color: #fbbf24;
            letter-spacing: 0.5px;
        }
        .header-bar p {
            font-size: 13px;
            color: #94a3b8;
        }
        #game-container {
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #334155;
            background-color: #000000;
        }
        #game-container canvas {
            display: block;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .controls-hint {
            margin-top: 10px;
            font-size: 12px;
            color: #64748b;
            text-align: center;
        }
        .controls-hint span {
            background: #1e293b;
            padding: 2px 6px;
            border-radius: 4px;
            color: #f1f5f9;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="header-bar">
        <h1 id="game-title">🎮 Game Petualangan Kita</h1>
        <p id="group-title">Karya Kelompok</p>
    </div>

    <div id="game-container"></div>

    <div class="controls-hint">
        🎮 Kontrol: <span>A / ◀</span> Kiri &bull; <span>D / ▶</span> Kanan &bull; <span>W / ▲</span> Lompat &bull; <span>E</span> Ajak Bicara &bull; <span>Spasi / F</span> Serang Musuh
    </div>

    <script type="module" src="/template-game/main.js"></script>
</body>
</html>
