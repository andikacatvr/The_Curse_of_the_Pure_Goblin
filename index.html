<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Curse of the Pure Goblin - 2D Adventure</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Pirata+One&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Fredoka', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        #game-container {
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border: none;
            box-shadow: none;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            touch-action: none;
            transition: width 0.22s cubic-bezier(0.16, 1, 0.3, 1), height 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #game-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            touch-action: none;
        }
        /* Mobile rotation hint banner */
        #rotate-hint {
            display: none;
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.94);
            border: 1.5px solid #f59e0b;
            color: #fef08a;
            padding: 7px 18px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
            z-index: 99999;
            pointer-events: none;
            text-align: center;
            align-items: center;
            gap: 8px;
            animation: pulseHint 2.4s ease-in-out infinite;
        }
        @keyframes pulseHint {
            0%, 100% { opacity: 0.9; transform: translateX(-50%) translateY(0); }
            50% { opacity: 1; transform: translateX(-50%) translateY(-2px); }
        }
        @media (orientation: portrait) and (max-width: 900px) {
            #rotate-hint {
                display: flex;
            }
        }
        /* Hidden font preloader to ensure canvas renders custom fonts instantly */
        .font-preload {
            position: absolute;
            width: 0;
            height: 0;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .preload-pirata { font-family: 'Pirata One', cursive; }
        .preload-fredoka { font-family: 'Fredoka', sans-serif; }

        /* Instant HTML Loading Splash (shown before Phaser compiles/downloads) */
        #html-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #030712;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 14px;
            z-index: 999998;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .loader-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(245, 158, 11, 0.2);
            border-top-color: #f59e0b;
            border-radius: 50%;
            animation: spinRing 0.85s linear infinite;
        }
        @keyframes spinRing {
            to { transform: rotate(360deg); }
        }
        .loader-title {
            font-family: 'Fredoka', 'Segoe UI', sans-serif;
            font-size: 19px;
            font-weight: 700;
            color: #fef08a;
            letter-spacing: 0.6px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            text-align: center;
            padding: 0 16px;
        }
        .loader-sub {
            font-family: 'Fredoka', 'Segoe UI', sans-serif;
            font-size: 13px;
            color: #94a3b8;
            text-align: center;
            padding: 0 16px;
        }
    </style>
</head>
<body>
    <div id="html-loader">
        <div class="loader-spinner"></div>
        <div class="loader-title">The Curse of the Pure Goblin</div>
        <div class="loader-sub">Memuat game, mohon tunggu sebentar...</div>
    </div>
    <div id="rotate-hint">📱 Putar layar HP ke posisi mendatar (Landscape) untuk pengalaman terbaik!</div>
    <div class="font-preload">
        <span class="preload-pirata">Pirata One Font Preload</span>
        <span class="preload-fredoka">Fredoka Font Preload</span>
    </div>
    <div id="game-container"></div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
