<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curse of the Pure Goblin - 2D Adventure</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Pirata+One&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Fredoka', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            user-select: none;
        }
        #game-container {
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 0;
            overflow: hidden;
            border: none;
            box-shadow: none;
            transition: width 0.2s ease, height 0.2s ease;
        }
        #game-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        /* Hidden font preloader to ensure canvas renders custom fonts instantly */
        .font-preload {
            position: absolute;
            width: 0;
            height: 0;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .preload-pirata { font-family: 'Pirata One', cursive; }
        .preload-fredoka { font-family: 'Fredoka', sans-serif; }
    </style>
</head>
<body>
    <div class="font-preload">
        <span class="preload-pirata">Pirata One Font Preload</span>
        <span class="preload-fredoka">Fredoka Font Preload</span>
    </div>
    <div id="game-container"></div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
